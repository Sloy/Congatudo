name: Fork build (Home Assistant amd64 image)

on:
  workflow_dispatch:
  push:
    tags:
      - '*-mop.*'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image tag
        id: tag
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            BUILD_FROM=homeassistant/amd64-base:3.18
            PKG_TARGET=node20-linuxstatic-x64
            PKG_OPTIONS=expose-gc,max-heap-size=256
          tags: |
            ghcr.io/sloy/congatudo:homeassistant-amd64-${{ steps.tag.outputs.version }}
            ghcr.io/sloy/congatudo:homeassistant-amd64-latest
